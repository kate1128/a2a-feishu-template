# Template for the credential Secret.
#
# Two ways to create the real Secret:
#
#   Option A (recommended) — edit this file, then:
#     cp deploy/k8s/secret.example.yaml deploy/k8s/secret.yaml
#     # fill in the real values below
#     kubectl apply -f deploy/k8s/secret.yaml
#
#   Option B — create directly from your local .env:
#     kubectl create secret generic feishu-bot-env \
#       --namespace feishu-bot \
#       --from-env-file=.env
#
# `stringData` encodes the values for you — no manual base64 needed.
apiVersion: v1
kind: Secret
metadata:
  name: feishu-bot-env
  namespace: feishu-bot
  labels:
    app.kubernetes.io/name: a2a-feishu-bot
type: Opaque
stringData:
  FEISHU_APP_ID: "cli_xxxxxxxxxxxxxxxx"
  FEISHU_APP_SECRET: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  # Optional (empty means disabled), but strongly recommended to enable encryption
  FEISHU_VERIFICATION_TOKEN: "xxxxxxxxxxxxxxxx"
  FEISHU_ENCRYPT_KEY: ""