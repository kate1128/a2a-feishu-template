apiVersion: v1
kind: Service
metadata:
  name: feishu-bot
  namespace: feishu-bot
  labels:
    app.kubernetes.io/name: a2a-feishu-bot
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: a2a-feishu-bot
  ports:
    - name: http
      port: 9000
      targetPort: http
  # Notes:
  # - WebSocket mode (default) does NOT need external exposure — the pod
  #   dials Feishu outbound.
  # - Webhook-mode fallback needs a public entry point. Either set
  #   type: LoadBalancer / NodePort here, or apply ingress.yaml.