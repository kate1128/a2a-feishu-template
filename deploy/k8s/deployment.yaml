apiVersion: apps/v1
kind: Deployment
metadata:
  name: feishu-bot
  namespace: feishu-bot
  labels:
    app.kubernetes.io/name: a2a-feishu-bot
    app.kubernetes.io/version: "0.1.0"
spec:
  # IMPORTANT: keep replicas at 1. The bot runs a single long-lived Feishu
  # WebSocket connection and keeps conversation sessions in memory (30-min
  # context window). More replicas would open duplicate connections and race
  # on the same events.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: a2a-feishu-bot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: a2a-feishu-bot
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: feishu-bot
          image: harbor.digitalchina.com/dcg/wuhan/tai/a2a-feishu-templat:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9000
          envFrom:
            # Credentials — create first (see secret.example.yaml), or the pod
            # will fail with CreateContainerConfigError.
            - secretRef:
                name: feishu-bot-env
            # Non-secret config. Ordered after the Secret so that PORT and
            # FEISHU_DOMAIN here win over any duplicate keys.
            - configMapRef:
                name: feishu-bot-config
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: tmp
          emptyDir: {}