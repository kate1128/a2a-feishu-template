[project]
name = "feishu-bot-template"
version = "0.1.0"
description = "Template for a Feishu (飞书) / Lark bot that connects to kagent via A2A"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.1",
    "pydantic>=2.11.4",
    "python-dotenv>=1.1.0",
    "lark-oapi>=1.4.0",
    "pycryptodome>=3.20.0",
    "websockets>=15.0",
]
